[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "aerolith"
version = "1.1.0"
description = "Frutiger Aero UI for the web: the Aerolith CSS and Bryce-rendered sprites as static files for Django, Flask, FastAPI and friends."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.8"
authors = [{ name = "Immineal" }]
keywords = ["frutiger-aero", "css", "ui", "static-files", "django", "flask", "bryce"]
classifiers = [
  "Framework :: Django",
  "Framework :: Flask",
  "Topic :: Software Development :: User Interfaces",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://immineal.github.io/aerolith/"
Source = "https://github.com/immineal/aerolith"
Issues = "https://github.com/immineal/aerolith/issues"

[tool.hatch.build]
# the static files are copied in from library/dist by scripts/stage.py (they are not tracked twice)
artifacts = ["src/aerolith/static/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/aerolith"]

[tool.hatch.build.targets.sdist]
include = ["src/aerolith", "README.md", "LICENSE"]
